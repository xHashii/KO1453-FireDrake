; Copy this file to "LogInServer.ini" next to the executable and edit it.
; The layout is identical to the original C++ LogInServer.ini, except [DATABASE]
; which replaces [ODBC] (MariaDB instead of an ODBC DSN to SQL Server).

[DATABASE]
; Account database (original DSN: KO_MAIN)
SERVER=127.0.0.1
PORT=3306
DATABASE=KO_MAIN
UID=knight
PWD=changeme

[SETTINGS]
PORT=15100
; If 1, the server still starts when the database is unreachable (logins will
; fail with AUTH_ERROR). Useful while testing the client before the DB exists.
ALLOW_OFFLINE_START=1

[DOWNLOAD]
URL=ftp.yoursite.net
PATH=/

[SERVER_LIST]
COUNT=1
SERVER_00=127.0.0.1
LANIP_00=127.0.0.1
NAME_00=Fire Drake|Server 1
ID_00=1
GROUPID_00=1
PREMLIMIT_00=3000
FREELIMIT_00=3000
KING1_00=
KING2_00=
KINGMSG1_00=
KINGMSG2_00=

[NEWS]
TITLE_00=
MESSAGE_00=
