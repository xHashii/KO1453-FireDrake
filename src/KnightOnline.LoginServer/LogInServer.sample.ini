; Copy this file to "LogInServer.ini" next to the executable and edit it.
; The layout is identical to the original C++ LogInServer.ini, except [DATABASE]
; which replaces [ODBC] (MariaDB instead of an ODBC DSN to SQL Server).

[DATABASE]
; The single account+game database. DATABASE is only a MariaDB database
; name: call it KN_Online (the old MSSQL/ODBC name) or anything else.
; If you rename it, use the same name in docker-compose.yml
; (MARIADB_DATABASE) and in the AdminPanel connection string.
SERVER=127.0.0.1
PORT=3306
DATABASE=KN_Online
UID=knight
PWD=changeme
; Create the configured database and apply sql/kn_online/*.sql automatically
; on startup. No manual HeidiSQL import needed. Set to 0 only if you manage
; schema yourself.
AUTO_MIGRATE=1
MIGRATIONS=sql/kn_online
; A migration that fails halfway leaves the tables it already created behind
; (MariaDB DDL is not transactional). With 1 (default) the next start cleans up
; those leftovers - dropping the empty tables the pending script creates, and
; truncating the static data tables it fills - so the retry just works. Tables
; that hold rows are never dropped; the server reports that instead. Set to 0
; only if you manage the schema by hand.
MIGRATION_REPAIR=1
; The original ACCOUNT_LOGIN silently created unknown accounts on first
; login. Keep 0 (default) to require accounts to already exist; set to 1 to
; enable that legacy auto-register behaviour.
AUTO_REGISTER=0

[SETTINGS]
PORT=15100
; If 1, the server still starts when the database is unreachable (logins will
; fail with AUTH_ERROR). Useful while testing the client before the DB exists.
ALLOW_OFFLINE_START=1
; The version clients are told to be, and the highest VERSION row offered to
; them as a patch. Set it to YOUR CLIENT'S version. The seeded VERSION table
; came from a live server that had patched to 1456, so with 0 (= use the
; table's highest) a 1453 client is told 1456, asks for patch1454..1456.zip and
; stops at "Cannot connect to FTP Server" before the login dialog ever appears.
; The LoginServer logs the version each client reports ("Patch check from ...
; client version NNNN"), which is how you find that number. 0 = original
; behaviour (highest sVersion in the table).
ADVERTISE_VERSION=1453

[DOWNLOAD]
URL=ftp.yoursite.net
PATH=/

[SERVER_LIST]
COUNT=1
SERVER_00=127.0.0.1
LANIP_00=127.0.0.1
NAME_00=Fire Drake|Server 1
ID_00=1
GROUPID_00=1
PREMLIMIT_00=3000
FREELIMIT_00=3000
KING1_00=
KING2_00=
KINGMSG1_00=
KINGMSG2_00=

[NEWS]
TITLE_00=
MESSAGE_00=
