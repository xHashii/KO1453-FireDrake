; GameServer configuration - copy to GameServer.ini (next to this file, i.e. in
; src\KnightOnline.GameServer\) and adjust. Every key shown is also the default
; used when the file or the key is missing, except the database credentials,
; which must match the ones in your LogInServer.ini [DATABASE] section.

[SETTINGS]
; TCP port the 1453 client dials after the login server hands out the server
; list. GameServer/GameServerDlg.cpp reads the same key with the same default.
PORT=15001
; Recovery mode: 0 suppresses equipment models on the character screen only.
; Saved inventory and in-world equipment are not modified. Set 1 to restore previews.
CHARACTER_PREVIEW_EQUIPMENT=0

[DATABASE]
SERVER=127.0.0.1
PORT=3306
DATABASE=KN_Online
UID=username
PWD=password
